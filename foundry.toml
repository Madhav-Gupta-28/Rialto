[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[profile.ci]
verbosity = 3
fuzz = { runs = 5000 }
invariant = { runs = 256, depth = 400 }

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
# Depth has to be large enough that a single run reaches a full lifecycle:
# open, bid, warp past the deadline, award, then repay or default. At shallow
# depth the invariants pass because the interesting states are never reached.
runs = 48
depth = 250
fail_on_revert = false
